<style>
/* Layout: sticky header · left outline rail (300px) + reading column (max 740px) · bottom tab bar on phones.
   Single dark theme by brand rule (QVC dark guide). */
:root{
  --bg:#12121C; --bg-deep:#0C0C14; --bg-raise:#181826;
  --surface:rgba(255,255,255,.04); --surface-hi:rgba(255,255,255,.07);
  --border:rgba(255,255,255,.08); --border-hi:rgba(255,255,255,.18);
  --text:#F0EAFF; --dim:rgba(240,234,255,.80); --mute:rgba(240,234,255,.66);
  --periwinkle:#B9BAFD; --lavender:#BC99FA; --mystic:#998EEA; --violet:#8A7AF7;
  --rose:#FAC1E4; --fairy:#FFA9F7; --magenta:#E472D2; --blush:#FBCFEA;
  --moon:#FCF0E4; --dusty:#E49BA6; --golden:#FED8AB; --stardust:#FFFCB3;
  --sage:#D8F0CC; --mint:#C2ECD6; --green:#5AF7AE;
  --crystal:#B8DAF6; --aqua:#4AEDFE; --pdream:#87B6FA;
  --gradient:linear-gradient(90deg,#B9BAFD 0%,#BC99FA 10%,#8A7AF7 18%,#FFA9F7 28%,#E472D2 37%,#FAC1E4 46%,#FED8AB 55%,#FFFCB3 63%,#5AF7AE 72%,#4AEDFE 81%,#87B6FA 91%,#B9BAFD 100%);
  --display:'DM Serif Display',Georgia,'Times New Roman',serif;
  --body:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:16px; --r-sm:10px;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-weight:400;font-size:15.5px;line-height:1.85;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--display);font-weight:400;line-height:1.22;margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--crystal);text-underline-offset:3px}
a:hover{color:var(--text)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--aqua);outline-offset:3px;border-radius:6px}
::selection{background:rgba(228,114,210,.35)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--bg-raise);color:var(--text);padding:10px 16px;border-radius:8px;border:1px solid var(--border-hi)}
.skip:focus{top:12px}

/* stars */
#stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;border-radius:50%;animation:twinkle ease-in-out infinite}
.sparkle{position:absolute;animation:sparklePop ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.03;transform:scale(.5)}50%{opacity:.22;transform:scale(1.15)}}
@keyframes sparklePop{0%,100%{opacity:0;transform:rotate(0) scale(.35)}50%{opacity:.24;transform:rotate(45deg) scale(1)}}

/* gradient display text */
.gt{background:var(--gradient);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:gflow 11s linear infinite}
@keyframes gflow{from{background-position:0% center}to{background-position:200% center}}
.gbar{height:4px;background:var(--gradient);background-size:200% auto;border-radius:100px;animation:gflow 11s linear infinite}

/* labels */
.eyebrow{display:block;font-family:var(--body);font-size:12px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:var(--magenta);line-height:1.5}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 20px;border-radius:100px;border:1px solid rgba(188,153,250,.34);background:rgba(188,153,250,.09);color:var(--lavender);font-size:12.5px;font-weight:500;letter-spacing:1.4px;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:background .2s,color .2s,border-color .2s;line-height:1.2;text-align:center}
.btn:hover{background:rgba(188,153,250,.2);color:var(--text)}
.btn.primary{background:var(--violet);border-color:var(--violet);color:#fff}
.btn.primary:hover{background:#9B8DF9;color:#fff}
.btn.done{color:var(--green);border-color:rgba(90,247,174,.4);background:rgba(90,247,174,.08)}
.btn.ghost{background:transparent;border-color:var(--border-hi);color:var(--dim)}
.btn.ghost:hover{color:var(--text);border-color:var(--lavender)}
.btn.small{min-height:36px;padding:6px 14px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* form fields */
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label,.lbl{font-size:14px;font-weight:500;color:var(--text);line-height:1.5}
textarea,input[type=text],input[type=number],input[type=date],input[type=search],select{width:100%;background:var(--bg-deep);border:1px solid var(--border-hi);border-radius:var(--r-sm);padding:11px 13px;font-size:15px;line-height:1.6;color:var(--text);transition:border-color .2s}
textarea{resize:vertical;min-height:84px}
textarea::placeholder,input::placeholder{color:rgba(240,234,255,.42)}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--lavender);box-shadow:0 0 0 3px rgba(188,153,250,.18)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--lavender) 50%),linear-gradient(135deg,var(--lavender) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
select option{background:var(--bg-raise)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--green);flex-shrink:0;margin:0;cursor:pointer}
input[type=radio]{accent-color:var(--fairy)}
input[type=range]{width:100%;accent-color:var(--fairy)}

/* progress bar */
.bar{height:6px;border-radius:100px;background:rgba(255,255,255,.08);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:100px;background:var(--gradient);background-size:400px auto}

@media (prefers-reduced-motion:reduce){
  .gt,.gbar,.star,.sparkle{animation:none!important}
  html{scroll-behavior:auto}
}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(18,18,28,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.top-in{max-width:1320px;margin:0 auto;padding:8px 20px;display:flex;align-items:center;gap:16px;min-height:64px}
.brand{display:flex;align-items:center;flex-shrink:0}
.brand .sym{display:none}
.iconbtn{display:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--border-hi);background:transparent;align-items:center;justify-content:center;cursor:pointer;color:var(--text);flex-shrink:0}
.tabs{display:flex;gap:4px;margin-left:auto}
.tabs a{font-size:12px;font-weight:500;letter-spacing:2.2px;text-transform:uppercase;color:var(--dim);text-decoration:none;padding:10px 14px;border-radius:100px;display:flex;align-items:center;gap:8px;line-height:1}
.tabs a:hover{color:var(--fairy)}
.tabs a[aria-current=page]{color:var(--text);background:var(--surface-hi)}
.tabs svg{display:none}
.save{font-size:12px;color:var(--mute);white-space:nowrap;display:flex;align-items:center;gap:6px;min-width:0}
.save::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mute);flex-shrink:0}
.save[data-k=account]::before{background:var(--green)}
.save[data-k=local]::before{background:var(--golden)}
.save[data-k=saving]::before{background:var(--aqua)}
.save[data-k=error]::before{background:var(--dusty)}

/* shell */
.shell{position:relative;z-index:1;max-width:1320px;margin:0 auto;display:grid;grid-template-columns:300px minmax(0,1fr);gap:0}
.side{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));height:calc(100vh - 64px - env(safe-area-inset-top,0px));overflow-y:auto;padding:24px 16px 40px 20px;border-right:1px solid var(--border);scrollbar-width:thin}
.side h2{font-family:var(--body);font-size:12px;font-weight:500;letter-spacing:3px;text-transform:uppercase;margin:22px 8px 8px;color:var(--mute)}
.side h2:first-child{margin-top:0}
.side h2[data-ph=ring]{color:var(--lavender)} .side h2[data-ph=gap]{color:var(--fairy)} .side h2[data-ph=star]{color:var(--golden)}
.slink{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--dim);text-decoration:none;font-size:14px;line-height:1.4}
.slink:hover{background:var(--surface);color:var(--text)}
.slink[aria-current=page]{background:var(--surface-hi);color:var(--text)}
.smod{margin:2px 0}
.smod > .slink{font-weight:500;color:var(--text)}
.smod .num{font-family:var(--display);font-size:15px;color:var(--mute);width:20px;flex-shrink:0;text-align:center}
.smod .frac{margin-left:auto;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;flex-shrink:0}
.smod .frac.full{color:var(--green)}
.slessons{list-style:none;margin:2px 0 8px;padding:0 0 0 20px;border-left:1px solid var(--border);margin-left:20px}
.slessons .slink{font-size:13.5px;padding:6px 10px}
.dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--border-hi);flex-shrink:0;display:inline-flex;align-items:center;justify-content:center}
.dot.on{background:var(--green);border-color:var(--green)}
.dot.on::after{content:"";width:6px;height:3px;border-left:1.5px solid #12121C;border-bottom:1.5px solid #12121C;transform:rotate(-45deg) translate(1px,-1px)}
.scrim{position:fixed;inset:0;background:rgba(6,6,12,.6);z-index:40}

main{min-width:0;padding:40px 48px 120px;outline:none}
.wrap{max-width:760px;margin:0 auto}
.wide{max-width:1000px;margin:0 auto}

/* typography inside content */
.prose{color:var(--dim)}
.prose > * + *{margin-top:16px}
.prose h3{font-size:24px;color:var(--periwinkle);margin-top:36px}
.prose h4{font-size:19px;color:var(--fairy);margin-top:28px}
.prose strong{color:var(--text);font-weight:500}
.prose em{color:var(--blush)}
.prose ul,.prose ol{padding-left:22px;margin-bottom:0}
.prose li{margin:6px 0;padding-left:4px}
.prose li::marker{color:var(--magenta)}
.prose blockquote{margin:0;padding:4px 0 4px 18px;border-left:3px solid var(--magenta);color:var(--text)}
.tag{display:inline-block;font-family:var(--body);font-size:11.5px;font-weight:500;letter-spacing:.6px;text-transform:uppercase;padding:1px 9px;border-radius:100px;border:1px solid;vertical-align:2px;line-height:1.6;white-space:nowrap}
.t-R{color:var(--green);border-color:rgba(90,247,174,.35);background:rgba(90,247,174,.07)}
.t-E{color:var(--aqua);border-color:rgba(74,237,254,.35);background:rgba(74,237,254,.07)}
.t-I{color:var(--golden);border-color:rgba(254,216,171,.35);background:rgba(254,216,171,.07)}
.t-O{color:var(--fairy);border-color:rgba(255,169,247,.35);background:rgba(255,169,247,.07)}
.t-S{color:var(--lavender);border-color:rgba(188,153,250,.35);background:rgba(188,153,250,.07)}

/* page heads */
.crumb{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.phase{font-size:12px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;padding:3px 12px;border-radius:100px;border:1px solid var(--border-hi);color:var(--dim)}
.phase[data-ph=ring]{color:var(--lavender);border-color:rgba(188,153,250,.35)}
.phase[data-ph=gap]{color:var(--fairy);border-color:rgba(255,169,247,.35)}
.phase[data-ph=star]{color:var(--golden);border-color:rgba(254,216,171,.35)}
.ptitle{font-size:clamp(32px,5vw,50px);line-height:1.12;margin-bottom:16px}
.ltitle{font-size:clamp(28px,4.4vw,42px);line-height:1.15;color:var(--periwinkle);margin-bottom:16px}
.meta{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13.5px;color:var(--mute);margin-bottom:8px}
.meta b{font-weight:500;color:var(--dim)}
.objective{font-family:var(--display);font-style:italic;font-size:20px;line-height:1.5;color:var(--blush);margin:18px 0 30px;padding-left:18px;border-left:3px solid var(--magenta)}

/* sections */
.sec{margin-top:52px}
.sec > h2{font-style:italic;font-size:28px;margin-bottom:6px}
.sec > .sub{color:var(--mute);font-size:14.5px;margin-bottom:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:26px}
.example{margin-top:36px;background:linear-gradient(180deg,rgba(138,122,247,.10),rgba(138,122,247,.03));border:1px solid rgba(138,122,247,.22);border-radius:var(--r);padding:24px 26px}
.example .eyebrow{color:var(--lavender);margin-bottom:6px}
.example h3{font-size:21px;color:var(--text);margin-bottom:10px}
.stack{display:flex;flex-direction:column;gap:22px}
.qnum{font-family:var(--display);color:var(--fairy);margin-right:6px}
.outbox{display:flex;gap:12px;align-items:flex-start;margin-top:20px;padding:14px 18px;border-radius:12px;background:rgba(90,247,174,.05);border:1px solid rgba(90,247,174,.18);font-size:14px;color:var(--dim)}
.outbox b{color:var(--green);font-weight:500}

/* complete bar */
.complete{margin-top:56px;padding:24px 26px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.complete p{font-size:14px;color:var(--mute);flex:1 1 260px;min-width:0}
.pager{display:flex;gap:12px;justify-content:space-between;margin-top:20px;flex-wrap:wrap}
.pager a{flex:1 1 220px;min-width:0;text-decoration:none;padding:16px 20px;border-radius:14px;border:1px solid var(--border);color:var(--dim);display:flex;flex-direction:column;gap:2px;transition:border-color .2s,background .2s}
.pager a:hover{border-color:var(--border-hi);background:var(--surface)}
.pager a span{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--mute)}
.pager a b{font-weight:500;color:var(--text);font-size:15px;line-height:1.4}
.pager a.next{text-align:right}

/* widgets */
.wg{margin-top:20px}
.rows{display:flex;flex-direction:column;gap:14px}
.row{border:1px solid var(--border);border-radius:14px;padding:18px;background:rgba(0,0,0,.18);display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;position:relative}
.row .fld.area,.row .fld.wide{grid-column:1/-1}
.row .rowhead{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--mute)}
.del{background:none;border:1px solid transparent;color:var(--mute);font-size:13px;cursor:pointer;padding:6px 10px;border-radius:8px;min-height:36px}
.del:hover{color:var(--dusty);border-color:rgba(228,155,166,.35)}
.chk{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--dim);cursor:pointer;line-height:1.5}
.chk.inl{min-height:44px}
.empty{padding:20px;border:1px dashed var(--border-hi);border-radius:14px;color:var(--mute);font-size:14px;text-align:center}
.rate{display:grid;grid-template-columns:minmax(0,1fr) 150px 36px;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.rate:last-child{border-bottom:none}
.rate label{font-size:14.5px;color:var(--dim);line-height:1.4}
.rate output{font-family:var(--display);font-size:20px;color:var(--fairy);text-align:right;font-variant-numeric:tabular-nums}
.checks{display:flex;flex-direction:column;gap:6px}
.week{display:flex;flex-direction:column;gap:10px}
.week .day{display:grid;grid-template-columns:110px minmax(0,1fr) minmax(0,.6fr);gap:10px;align-items:start}
.week .dname{font-family:var(--display);font-size:17px;color:var(--periwinkle);padding-top:10px}
.week textarea{min-height:48px}
.d30{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.dcell{border:1px solid var(--border);border-radius:12px;padding:10px;background:rgba(0,0,0,.18);display:flex;flex-direction:column;gap:6px}
.dcell.on{border-color:rgba(90,247,174,.35);background:rgba(90,247,174,.05)}
.dcell .dh{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mute)}
.dcell textarea{min-height:60px;font-size:14px;padding:8px 10px}
.wkhead{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--magenta);grid-column:1/-1;margin-top:8px}

/* assessment */
.aq{border:none;padding:14px 0;margin:0;border-bottom:1px solid var(--border)}
.aq legend{font-size:15px;color:var(--text);padding:0;margin-bottom:10px;line-height:1.5}
.scale{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.scale label{position:relative}
.scale input{position:absolute;opacity:0;width:44px;height:44px;margin:0;cursor:pointer}
.scale span{display:flex;width:44px;height:44px;border-radius:50%;border:1px solid var(--border-hi);align-items:center;justify-content:center;font-variant-numeric:tabular-nums;color:var(--dim);transition:all .15s}
.scale input:checked + span{background:var(--fairy);border-color:var(--fairy);color:#12121C;font-weight:500}
.scale input:focus-visible + span{outline:2px solid var(--aqua);outline-offset:2px}
.scale .ends{font-size:12px;color:var(--mute);margin:0 4px}
.aprog{font-size:13px;color:var(--mute);margin:14px 0}
.profile{margin-top:24px;display:flex;flex-direction:column;gap:18px}
.prow2{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;align-items:start}
.prow2 .nm{font-family:var(--display);font-size:17px;color:var(--text);line-height:1.3}
.prow2 .nm small{display:block;font-family:var(--body);font-size:12px;color:var(--mute);margin-top:4px}
.pb{display:flex;flex-direction:column;gap:6px}
.pbl{display:grid;grid-template-columns:56px minmax(0,1fr) 38px;gap:10px;align-items:center;font-size:12px;color:var(--mute)}
.pbl .bar{height:9px}
.pbl .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--dim)}
.bar.start > i{background:var(--lavender)}
.bar.end > i{background:var(--fairy)}
.pnote{font-size:14px;color:var(--dim);line-height:1.7}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:20px}
.qq{border:1px solid var(--border);border-radius:14px;padding:20px;background:rgba(0,0,0,.15)}
.qq h3{font-family:var(--body);font-weight:500;font-size:15.5px;line-height:1.5;margin-bottom:12px;color:var(--text)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:12px 16px;border-radius:12px;border:1px solid var(--border-hi);background:transparent;cursor:pointer;font-size:14.5px;line-height:1.5;color:var(--dim);min-height:44px}
.opt:hover{border-color:var(--lavender);color:var(--text)}
.opt.right{border-color:rgba(90,247,174,.55);background:rgba(90,247,174,.08);color:var(--text)}
.opt.wrong{border-color:rgba(228,155,166,.55);background:rgba(228,155,166,.08)}
.why{margin-top:12px;font-size:14px;color:var(--dim);line-height:1.7;padding:12px 14px;border-radius:10px;background:var(--surface)}
.why b{font-weight:500}
.why b.ok{color:var(--green)} .why b.no{color:var(--dusty)}

/* home */
.hero{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:12px 0 8px}
.hero h1{font-size:clamp(44px,7.5vw,84px);line-height:1.02;letter-spacing:-.5px}
.hero .lead{font-family:var(--display);font-style:italic;font-size:clamp(19px,2.6vw,25px);color:var(--blush);line-height:1.45;max-width:30ch}
.cont{margin-top:34px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px}
.stat{font-family:var(--display);font-size:46px;line-height:1;color:var(--text);font-variant-numeric:tabular-nums}
.stat small{font-family:var(--body);font-size:14px;color:var(--mute);margin-left:6px}
.phases{margin-top:44px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.phcol h3{font-size:22px;margin-bottom:4px}
.phcol > p{font-size:13.5px;color:var(--mute);line-height:1.6;margin-bottom:14px;min-height:44px}
.mcard{display:block;text-decoration:none;color:var(--dim);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:10px;background:var(--surface);transition:border-color .2s,background .2s}
.mcard:hover{border-color:var(--border-hi);background:var(--surface-hi)}
.mcard .mn{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--mute)}
.mcard b{display:block;font-family:var(--display);font-weight:400;font-size:18px;color:var(--text);line-height:1.3;margin:2px 0 10px}
.mcard .bar{height:4px}
.mcard .ft{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:6px;font-variant-numeric:tabular-nums}
.orient{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.tools{margin-top:44px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tool{text-decoration:none;color:var(--dim);display:flex;flex-direction:column;gap:6px}
.tool h3{font-size:20px;color:var(--periwinkle)}
.tool p{font-size:14px;line-height:1.65}

/* module overview */
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:28px}
.mgrid .card h3{font-family:var(--body);font-size:12px;font-weight:500;letter-spacing:2.5px;text-transform:uppercase;color:var(--magenta);margin-bottom:8px}
.mgrid .card p{font-size:14.5px;color:var(--dim);line-height:1.75}
.llist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.llist a{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:14px;align-items:center;text-decoration:none;padding:16px 18px;border:1px solid var(--border);border-radius:14px;color:var(--dim);background:var(--surface)}
.llist a:hover{border-color:var(--border-hi)}
.llist b{display:block;font-family:var(--display);font-weight:400;font-size:18px;color:var(--text);line-height:1.3}
.llist small{font-size:13px;color:var(--mute)}
.llist .mins{font-size:12px;color:var(--mute);white-space:nowrap}
.bridge{margin-top:44px;font-family:var(--display);font-size:20px;line-height:1.55;color:var(--text);padding:24px 26px;border-radius:var(--r);background:radial-gradient(ellipse at 0% 0%,rgba(228,114,210,.12),transparent 60%),var(--surface);border:1px solid var(--border)}

/* toolkit */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 6px}
.chips a{font-size:12.5px;font-weight:500;letter-spacing:1.2px;text-transform:uppercase;padding:9px 16px;border-radius:100px;border:1px solid var(--border-hi);color:var(--dim);text-decoration:none;min-height:40px;display:inline-flex;align-items:center}
.chips a[aria-current=page]{background:var(--surface-hi);color:var(--text);border-color:var(--lavender)}
.tblock{margin-top:44px}
.tblock > h2{font-size:26px;font-style:italic;color:var(--periwinkle);margin-bottom:14px}

/* plan */
.open{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.open li{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:space-between;align-items:center;padding:12px 16px;border:1px solid var(--border);border-radius:12px;font-size:14px;color:var(--dim)}
.open li a{font-weight:500}
.summary{display:flex;flex-direction:column;gap:14px}
.sitem{border-left:3px solid var(--border-hi);padding:2px 0 2px 16px}
.sitem h3{font-family:var(--body);font-size:12px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:var(--magenta);margin-bottom:4px}
.sitem div{white-space:pre-wrap;font-size:14.5px;color:var(--dim);line-height:1.7}
.sitem.emptyi div{color:var(--mute);font-style:italic}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.confirm{margin-top:12px;padding:14px 16px;border-radius:12px;border:1px solid rgba(228,155,166,.4);background:rgba(228,155,166,.06);font-size:14px;color:var(--dim);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.msg{font-size:13.5px;color:var(--mute);min-height:1.6em;margin-top:8px}
.legend{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 14px;align-items:baseline;font-size:14.5px;color:var(--dim)}
.refs{display:flex;flex-direction:column;gap:12px;padding:0;list-style:none;margin:0}
.refs li{font-size:14px;color:var(--dim);line-height:1.65;padding-left:16px;border-left:2px solid var(--border-hi)}
.refs li small{display:block;color:var(--mute);font-style:italic}

/* footer */
.foot{position:relative;z-index:1;border-top:1px solid var(--border);padding-block:48px 120px;padding-inline:20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.foot p{font-size:13px;color:var(--mute);line-height:1.7;max-width:60ch}
.foot a{color:var(--mute)}

@media (max-width:1060px){
  main{padding:32px 28px 120px}
  .side{width:300px}
}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .iconbtn{display:inline-flex}
  .side{position:fixed;top:0;left:0;bottom:0;height:auto;width:min(320px,86vw);z-index:50;background:var(--bg-raise);transform:translateX(-102%);transition:transform .25s ease;padding-top:calc(24px + env(safe-area-inset-top,0px));border-right:1px solid var(--border-hi)}
  .side.open{transform:none}
  .phases,.tools{grid-template-columns:minmax(0,1fr)}
  .phcol > p{min-height:0}
}
@media (max-width:780px){
  .brand .lock{display:none}
  .brand .sym{display:block}
  .top{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(18,18,28,.97)}
  .top-in{padding:8px 16px;min-height:60px;gap:12px}
  .tabs{position:fixed;left:0;right:0;bottom:0;margin:0;z-index:35;background:rgba(18,18,28,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;gap:0}
  .tabs a{flex-direction:column;gap:4px;font-size:11px;letter-spacing:1px;padding:6px 8px;border-radius:10px;min-width:64px;min-height:48px;justify-content:center}
  .tabs svg{display:block}
  .save{margin-left:auto}
  main{padding:24px 16px 120px}
  .cont,.mgrid{grid-template-columns:minmax(0,1fr)}
  .card,.example,.complete{padding:20px}
  .prow2{grid-template-columns:minmax(0,1fr);gap:8px}
  .rate{grid-template-columns:minmax(0,1fr) 36px}
  .rate input{grid-column:1/-1;grid-row:2}
  .week .day{grid-template-columns:minmax(0,1fr)}
  .week .dname{padding-top:4px}
  .pager a.next{text-align:left}
}
@media (max-width:420px){
  .save span{display:none}
}

      body: `### What you can expect

This course combines three kinds of work. **Inner work** helps you understand why visibility feels threatening. **Capacity work** helps you practise being seen in small, deliberate steps. **Practical work** helps you create content, build a simple system, and connect your visibility to an offer or community.

      body: `### A map for the journey [[O]]

The symbol of Quantum Visibility Collective is a ring with a gap in it, a point at the centre, and a star that has stepped outside. This course follows that shape.

**The Ring** (Modules 1–3) is the place you have been staying. It is familiar and it has kept you safe. In this phase you study how hiding works for you: what you fear, what you believe about yourself, and the habits that keep you protected.

**The Gap** (Modules 4–5) is the step out. It stays open on purpose. Here you build capacity: the ability to feel uncomfortable without obeying the discomfort, and the habit of keeping small promises to yourself.

### What visibility actually means

      body: `### Why measure where you start

When you change slowly, it is easy to forget how far you have come. A starting snapshot gives you something real to compare against at the end. You will retake this assessment in the final lesson.

### About this assessment [[O]]

This module is an audit. You are gathering information, not fixing anything yet.`,

      objective: "Recognize that visibility has several distinct parts, and identify which ones feel hardest for you.",
      body: `### Being seen is not one thing [[O]]

When you put yourself out there, you can be exposed in at least five different ways. Each one asks something different of you.

- **Face.** Your appearance, your expressions, your age, how you look on camera.
- **Voice.** How you sound, your accent, the way you speak when you are nervous.
- **Opinion.** What you believe and are willing to say out loud, including views others may disagree with.
- **Story.** Your lived experience, your past, the things that shaped you.
- **Offer.** Asking for something: a sign-up, a purchase, a membership. Admitting that you want to be paid for your work.

There is one more variable that sits across all five: **audience**. Being seen by strangers feels very different from being seen by people who knew you before. Many women find that the hardest audience is not the internet at large. It is the twenty people from their old life who might quietly watch.

### Why this matters

If you treat visibility as one giant fear, your options look like "do everything" or "do nothing." When you split it into parts, you find middle paths. You might start with Opinion in written form, with no Face at all. You might share Story without sharing your Offer yet. Each step builds capacity for the next.

### Lower-exposure formats are real options

Written posts, carousels, voiceovers over b-roll, audio, and faceless video are legitimate ways to build a business. You do not have to show your face to be successful. You may choose to later, and you may not. This course will never treat a lower-exposure format as a lesser one.`,

    {
      id: "1-2", title: "Why judgment feels so dangerous", mins: "4–6 min",
      objective: "Understand the psychology that makes judgment feel threatening, and why your brain overestimates how closely you are being watched.",
      body: `### You are wired to care what people think [[R]]

Humans have a strong, basic need to belong. Psychologists Roy Baumeister and Mark Leary reviewed a large body of research in 1995 and concluded that the need for lasting, positive connection is one of the most fundamental human motivations. For most of human history, being rejected by your group was genuinely dangerous.

So when you imagine people judging you, your brain is not being silly. It is doing an old job. The trouble is that it treats a raised eyebrow from an old classmate as if it carried the same stakes as being pushed out of the village.

### Fear of negative evaluation [[R]]

Some people feel this pull more strongly than others. Researchers call it **fear of negative evaluation**: worry about other people's judgments, distress when you expect to be judged unfavourably, and a tendency to avoid situations where evaluation might happen. It has been measured as a stable trait since the early 1980s. If you score high on it, nothing is wrong with you. You simply have a more sensitive alarm.

### Your brain overestimates the spotlight [[R]]

Two well-known findings from social psychology are worth knowing.

The **spotlight effect**: in a 2000 study by Thomas Gilovich and colleagues, students wore an embarrassing T-shirt into a room of peers. They estimated that about half the room noticed. In fact, roughly a quarter did. We consistently overestimate how much others notice about us.

The **illusion of transparency**: we also overestimate how visible our inner states are. When you feel nervous on camera, you assume it shows clearly. Viewers usually notice far less than you feel.

### One critical voice feels louder than ten kind ones [[R]]

Researchers have found that negative events and information tend to have a stronger impact on us than positive ones of the same size. This is often called **negativity bias**. It explains why one unkind comment can outweigh twenty warm ones in your memory. Knowing this does not make the sting go away, but it helps you keep it in proportion.

### What this means in practice

Your fear is real. Your estimate of how much people notice and how harshly they judge is often inflated. You do not need to argue with the fear. You can hold both truths: "This feels dangerous" and "The actual risk is probably smaller than it feels."`,
      example: { title: "The post nobody mentioned", text: `Carmen agonized for a week before sharing a video about leaving her nursing career to work as an energy practitioner. She was sure her former coworkers would mock it. Two of them liked it. One sent a kind message. Nobody else said anything at all. She realized most people were busy with their own lives.` },

    {
      id: "1-3", title: "Your fear inventory", mins: "4–6 min",
      objective: "Write out your specific feared outcomes so they can be examined instead of only felt.",
      body: `### Follow the fear to the end

Fear usually shows up as a feeling, not a sentence. A useful step is to turn the feeling into specific predictions. Ask, "If I post this, what exactly do I expect will happen? And then what? And then what?"

You will often find a chain like this: *If I post a video, people from my old job will see it. They'll think I've gone weird. They'll talk about it. I'll be embarrassed to see them. I'll feel like I don't belong anywhere.*

The last link in the chain is usually the real fear. In this example, it is not the video. It is losing belonging.

### Four questions for each fear [[E]]

Cognitive approaches to anxiety commonly ask people to examine feared predictions rather than simply accept them. For each fear, ask:

- **What exactly do I predict?** Be specific. "People will judge me" is vague. "My sister will say I'm trying to be an influencer at dinner" is specific.
- **How likely is it, honestly?** Give a percentage. Then notice whether your feelings and your estimate match.
- **If it happened, how bad would it really be?** Distinguish uncomfortable from catastrophic.
- **How would I cope?** You have survived awkward moments before. What would you do?

This approach has good research support for anxiety in general. It is a tool, not a cure, and it works best combined with action, which you will practise in Module 4.

### The fears that come up most

Women in this community most often name these: being laughed at by people from the past, being seen as arrogant or "too much," being misunderstood, being asked a question they cannot answer, receiving a cruel comment, being exposed as not good enough, and success itself, with its extra attention and responsibility. Fear of success is common and rarely talked about. If it is on your list, you are not alone.`,
      example: { title: "One fear, examined", text: `**Prediction:** My ex-husband's family will see my content and make fun of me.

**Coping:** I'd feel it, talk to my friend Jo, and remind myself that their opinion of me was formed years ago.
**Real fear underneath:** Being judged as the person I used to be, instead of who I'm becoming.` },

      objective: "Tell the difference between a healthy privacy boundary and fear-driven avoidance.",
      body: `### Both look like "I'm not sharing that"

Some things you keep private because you have thought about it and chosen to. Other things you keep private because the fear chose for you. From the outside, they look the same. From the inside, they feel different.

### Signs of a boundary [[O]]

- It connects to a value you can name: protecting your children, keeping your marriage private, focusing on your work rather than your life.
- It stays stable. You would make the same choice on a confident day.
- It brings a feeling of steadiness or spaciousness.
- You can explain it simply without shame: "I don't share my kids online."

### Signs of avoidance [[O]]

- It is attached to "not yet" or "when I'm ready," with no clear condition for readiness.
- The list of things you will not do keeps growing.
- It brings quick relief followed by a sense of shrinking or disappointment.
- You would make a different choice if the fear disappeared tomorrow.

### The test question

Ask: **"If I felt completely safe, would I still choose this?"** If the answer is yes, it is probably a boundary. If the answer is no, it is probably avoidance. If you are unsure, you can treat it as an open question and revisit it later.

### Why this matters for a spiritual business

Some spiritual teaching encourages total openness, as if any privacy means you are blocked or inauthentic. That is not true. Authenticity means what you share is real. It does not mean you share everything. Strong boundaries are part of what makes visibility sustainable.

At the same time, "I'm protecting my energy" can sometimes be a beautiful phrase covering an old fear. Both can be true at different times. Your job is to look honestly.`,
      example: { title: "Sorting the list", text: `Priya listed what she doesn't share. "My kids' faces" was clearly a boundary. "My divorce story" was a boundary for now, because it involves another person and she has not finished processing it. "Showing my face on video" was avoidance: she said yes to the test question honestly, she would do it if she felt safe. That last one went on her visibility ladder in Module 4.` },

Go gently. You are exploring possibilities, not diagnosing yourself. Some patterns may connect to your history. Some may simply be habits. You do not need to know exactly where something came from to change how you respond to it.`,
  lessons: [
    {
      id: "2-1", title: "The self you're protecting", mins: "4–6 min",
      objective: "Recognize how your current self-concept makes certain kinds of visibility feel unnatural or unsafe.",
      body: `### Identity shapes behaviour [[R]]

Psychologist Daphna Oyserman's research on **identity-based motivation** suggests that people are more likely to take action when the action feels consistent with who they believe they are. Identity also shapes how we read difficulty. If something feels hard and it fits your identity, you tend to read the difficulty as "this matters." If it does not fit, you tend to read it as "this isn't for people like me."

That second reading is exactly what happens with visibility. When posting feels hard, the old identity says, *See? You're not a public person.*

### The roles that keep you small

Many women in this community carry identity labels that were useful once and are now quietly limiting:

- "I'm the quiet one" or "I'm a behind-the-scenes person."
- "I'm the one who holds everything together," so taking up space feels selfish.
- "I'm spiritual, not business-minded," so selling feels like betrayal.
- "I'm a late bloomer" or "I'm too old to start this."
- "I'm the one who always starts things and never finishes."

None of these are lies exactly. They describe how you have often been. They become a problem when they turn into rules for how you must always be.

### From identity as a fact to identity as a practice

You do not need to wait until you feel like a visible person to act like one. Identity tends to follow repeated action. Each small visible step is a piece of evidence. Over time, the evidence builds a different self-concept. You will work with this directly in Module 5.

### A reflective lens [[S]]

Some women find it meaningful to see this as shedding a skin: the old identity is not wrong, it is simply outgrown. Others prefer the language of becoming. Use whichever helps.`,
      example: { title: "The helper who never asked", text: `Rosa, 52, has always been the one who helps. In her family, at work, in her church, she shows up for everyone. When she tried to promote her coaching program, it felt physically wrong. Looking closer, she saw the rule: "Good women give. They don't ask." Visibility for her business meant breaking a rule her whole identity was built on. Naming it didn't make it easy, but it explained why marketing felt so much harder than anything else she'd learned.` },

    {
      id: "2-2", title: "Shame and the \"too much, not enough\" story", mins: "4–6 min",
      objective: "Understand how shame operates in visibility and begin rewriting the stories that keep you hidden.",
      body: `### Shame is about the whole self [[R]]

Research by June Tangney and Ronda Dearing distinguishes **shame** from **guilt**. Guilt focuses on a behaviour: "I did something bad." Shame focuses on the whole self: "I am bad." Their research links guilt with repair and making amends, while shame is more often linked to hiding, withdrawing and defensiveness.

This explains a lot about visibility. Being seen feels like being evaluated as a whole person. If you carry shame, the urge to hide is not laziness or lack of discipline. It is what shame does.

### The two big stories

Visibility shame usually tells one of two stories, and sometimes both.

**Too much:** too emotional, too spiritual, too loud, too ambitious, too intense, too opinionated, too sensitive. This story says that if people see the real you, they will pull away.

**Not enough:** not qualified, not young, not successful, not far enough along, not polished, not healed enough to teach. This story says that if people see the real you, they will be unimpressed.

Many women carry both at once: too much of what they are, and not enough of what they should be.

### Looking at where the rule came from

You may be able to trace a story to a person, a family culture, a religion, a workplace, or a single painful moment. You may not. Both are fine. Not every pattern comes from childhood or trauma, and you do not need a clear origin to work with it. What helps most is noticing the story when it shows up, and choosing whether to follow it.

### Talking back with accuracy, not hype

Replacing "I'm too much" with "I'm amazing and everyone will love me" rarely works, because part of you knows it is not true. A more useful rewrite is accurate and kind: "Some people will find my style too much. The people I'm here for will find it a relief."`,
      example: { title: "Rewriting a shame story", text: `**Old story:** "I'm too woo. Normal people will think I'm ridiculous."
**Where it may come from:** A family that mocked anything spiritual.
**What it protected:** It kept me from being laughed at at dinner.
**What it costs now:** I hide the very thing my audience is looking for.
**Accurate, kind rewrite:** "Some people will roll their eyes. The women who are searching for exactly this will feel less alone."` },

    {
      id: "2-3", title: "Impostor feelings and the credibility question", mins: "4–6 min",
      objective: "Separate impostor feelings from your actual credibility, and describe what you can honestly offer.",
      body: `### Impostor feelings are common [[R]]

Psychologists Pauline Clance and Suzanne Imes first described the **impostor phenomenon** in 1978, after noticing that many high-achieving women believed they were not truly competent and feared being found out. A 2020 systematic review by Dena Bravata and colleagues found that impostor feelings are widely reported across groups and are associated with anxiety and depression, though studies measure them in different ways, so exact prevalence figures vary.

The key point: **impostor feelings are a feeling, not evidence.** Many people who feel like frauds are highly competent. The feeling often shows up precisely when you step into something new.

### But credibility is a real question

Some visibility advice says, "Just post. Everyone is an expert at something." That skips over something important, especially in spiritual and wellness spaces. You do have a responsibility to be honest about what you know and what you do not.

The answer is not to wait until you are an expert. It is to **teach from where you actually are**, and to say so.

### Four sources of credibility [[O]]

- **Lived experience:** what you have been through and come out the other side of.
- **Learned knowledge:** training, study, certifications, years of reading and practice.
- **Results:** changes you have helped yourself or others create.
- **Perspective:** the unique way you connect ideas, which no one else has quite like you.

You do not need all four. You need to know which ones you have and speak from those.

### Guide, not guru

You can position yourself as a fellow traveller who is a few steps ahead on a particular path. That is honest and it is often more relatable than expertise. It also means naming your edges: "I'm not a therapist. Here's what helped me, and here's when to get more support."`,
      example: { title: "Honest positioning", text: `Ana is a certified yoga teacher who healed her own burnout over three years. Her old bio said, "Holistic healer helping women transform their lives." It felt like a costume. Her new bio says, "I teach the simple daily practices that helped me recover from burnout. I'm a yoga teacher, not a doctor. I share what worked for me and the research behind it." She feels less like an impostor because she no longer claims to be something she isn't.` },

This module helps you catch those moves. You are not trying to shame them away. Each pattern was trying to help. You are learning to notice when the help has stopped helping.`,

    {
      id: "3-1", title: "How avoidance pays you", mins: "3–5 min",
      objective: "Understand why avoidance feels good in the moment and why that makes fear stronger over time.",
      body: `### The relief loop [[R]]

When you avoid something you fear, you feel relief. That relief is a reward, and behaviour that is rewarded tends to repeat. Psychologists call this **negative reinforcement**: a behaviour becomes more likely because it takes away something unpleasant.

Here is the catch. Each time you avoid, you also miss the chance to learn that the feared thing was survivable. The fear stays untested and stays big. Over time, the list of things that feel too risky usually grows.

### Safety behaviours [[R]]

In their influential model of social anxiety, David Clark and Adrian Wells described **safety behaviours**: small things people do to feel safer in a feared situation. Research suggests these behaviours often keep anxiety going, because they stop you from learning that you would have been fine without them.

Online, safety behaviours can look like:

- Posting late at night so fewer people see it.
- Writing long disclaimers before you say anything.
- Never replying to comments, or replying instantly so nothing sits unanswered.
- Deleting a post within an hour.
- Over-scripting every word so you never sound unsure.
- Turning off comments, or hiding your content from people you know.
- Only sharing other people's quotes instead of your own ideas.

Some of these are sensible boundaries for some people. The question, again, is whether you are choosing them or whether fear is.

### What changes when you see it

You do not need to stop every safety behaviour at once. Simply noticing, "I'm adding a disclaimer because I'm scared, not because it helps the reader," gives you a choice you did not have before. Later, in Module 4, you will drop safety behaviours deliberately as experiments.`,
      example: { title: "The midnight poster", text: `Jess only ever posted after 11pm. "Fewer people are online," she said. It felt safer, and every time she did it, the relief taught her that posting was only safe at night. Her content also reached almost no one, so she never got evidence that people wanted to hear from her. The safety behaviour was protecting the fear and starving the business.` },

    {
      id: "3-2", title: "Perfectionism and the polishing trap", mins: "4–6 min",
      objective: "Distinguish healthy high standards from fear-driven perfectionism, and set a workable \"done\" standard.",
      body: `### Two kinds of perfectionism [[R]]

Researchers often separate two parts of perfectionism. **Perfectionistic strivings** are high personal standards: wanting to do good work. **Perfectionistic concerns** are worry about mistakes, fear of others' evaluation, and the feeling that nothing you do is ever good enough. A 2006 review by Joachim Stoeber and Kathleen Otto found that concerns are consistently linked with distress, while strivings have more mixed and sometimes positive effects.

So caring about quality is not the problem. The problem is when the standard is really about never being criticized.

### Procrastination is about feelings, not time [[R]]

Research by Fuschia Sirois and Timothy Pychyl describes procrastination as a form of **short-term mood repair**. You delay because the task brings up uncomfortable feelings, and delaying makes those feelings go away for now. Your future self pays the bill.

Polishing is a sneaky version of this. Re-recording a video eleven times feels productive. It is often a way to avoid the moment of hitting "post."

### "Good enough to be useful" [[O]]

Instead of asking "Is this perfect?" ask three questions:

- **Is it clear?** Would the person I'm talking to understand the main point?
- **Is it true?** Am I saying something I actually believe and can stand behind?
- **Is it useful or meaningful?** Will it help, comfort, or make someone think?

If the answer to all three is yes, it is ready. Spelling slips, a slightly awkward pause, or lighting that is not ideal rarely matter to the person on the other side.

### Time limits help

Decide in advance how long a piece of content gets. For example: 45 minutes for a carousel, three takes for a video. When the time is up, you either post it or decide consciously to save it as a draft with a date to return. The limit turns an endless polish into a choice.`,
      example: { title: "Three takes", text: `Nicole used to record a 60-second video up to twenty times. She set a rule: three takes, then pick the best. The first week she hated it. By the fourth week she noticed that her third take was usually her best anyway, because she relaxed. Her audience never noticed a difference in quality. She noticed a big difference in how often she posted.` },

    {
      id: "3-3", title: "When learning becomes hiding", mins: "4–6 min",
      objective: "Recognize when consuming content, courses and spiritual teachings has become a substitute for action.",
      body: `### It feels like progress

Reading, watching, taking courses and journaling about your purpose all feel productive. Learning releases a little sense of achievement without any exposure. That is exactly why it can become the most comfortable hiding place of all, especially for curious, spiritually minded women who genuinely love to learn.

### Signs learning has become avoidance [[O]]

- You have bought more courses than you have finished.
- You feel you need "one more" framework, certification or healing before you start.
- You can explain your niche beautifully but have not posted about it.
- You journal about your purpose more than you act on it.
- You switch between teachers looking for the one who will finally make it feel safe.

### Insight is not the same as change

Understanding why you hide can be valuable. It is also possible to understand your patterns in great depth and still hide. At some point the only new information available comes from acting. You learn what your audience responds to by posting. You learn that you can survive judgment by being seen.

### A simple rule: learn, then apply [[O]]

      example: { title: "The fourth certification", text: `Marisol had a Reiki certification, a coaching certification and a Human Design course. She was enrolled in a fourth program "so I'll feel more qualified." When she listed what she already knew, it filled two pages. She paused the fourth program, used her existing knowledge to post twice a week for two months, and found that what her audience wanted most was her experience leaving teaching, which no certification could give her.` },

    {
      id: "3-4", title: "The disappearing act", mins: "4–6 min",
      objective: "Understand the cycle of showing up and disappearing, and map your own avoidance loop with an alternative response.",
      body: `### The pattern many women know well

You finally post. You post again. For a week or two you feel brave. Then something happens: a post gets almost no response, someone you know comments in a way that feels off, or you simply feel exposed. You go quiet. Days become weeks. When you come back, you feel you need to explain the absence, or start fresh with a new account, a new niche, a new name.

### The exposure hangover

Many people describe a wave of discomfort a few hours or a day after sharing something personal. The popular phrase "vulnerability hangover" comes from author Brené Brown. It is a description, not a clinical term, and it fits a common experience: the brain replays what you shared and scans for danger after the fact.

The hangover is normal. It passes. It is not proof that you shared too much. It may simply mean you did something new.

### Reading silence as a verdict

When a post gets little response, it is tempting to conclude, "People don't like me," or "This niche doesn't work." Early on, low response mostly means low reach: very few people saw it. It is information about distribution, not a judgment on your worth. You will learn to read results properly in Module 8.

### Rebranding as disappearing

Constantly changing your niche, name, colours or offer can be another version of the same pattern. Each fresh start offers a clean slate with no history of being judged. Sometimes a pivot is wise. Often it is the Ring offering a new hiding place.

### Mapping your loop [[O]]

Patterns are easier to interrupt once you can see their steps. A loop usually looks like this: **trigger → thought → feeling → protective behaviour → short-term payoff → long-term cost.** The point where you can intervene is between the feeling and the behaviour. You will write an alternative response for exactly that moment.`,

  lessons: [

      id: "4-1", title: "What happens in your body when you're seen", mins: "4–6 min",
      objective: "Understand the basic stress response, recognize your own visibility signals, and learn one research-backed way to reframe them.",
      body: `### Your body's alarm system [[R]]

When your brain detects a possible threat, including a social one, your body prepares to respond. Common signs include a faster heartbeat, quicker or shallower breathing, tight muscles, a dry mouth, butterflies, sweating, and attention narrowing onto the threat. Some people also feel a pull to freeze, go blank, or shut down.

These are normal stress responses. They are not dangerous, and they are not a sign that something is wrong with you. They are your body getting ready for something that matters.

### A careful note about popular language [[E]]

You may have heard visibility fear described with nervous system language, such as "dysregulation" or polyvagal theory. Polyvagal theory is popular in wellness spaces and many people find its language helpful for describing their experience. Some of its specific physiological claims are debated by researchers. You can use language that helps you notice your body without treating it as settled science.

Also, not every uncomfortable feeling means you are dysregulated. Nervousness before doing something new and meaningful is ordinary. Sometimes the feeling is simply the cost of growth.

### Reframing the feeling [[R]]

In a 2014 study, Alison Wood Brooks found that people who said "I am excited" before a stressful task, such as public speaking or singing, performed better and felt more excited than people who tried to calm down. Other research by Jeremy Jamieson and colleagues suggests that learning to see stress arousal as helpful can improve how the body responds to stress.

These studies were done in labs with specific tasks, so the effects will not be the same for everyone. The practical idea is still useful: anxiety and excitement feel physically similar. You may not be able to make yourself calm in two minutes, but you can sometimes relabel the energy as readiness.

### Know your signals

Everyone's visibility response is a little different. Learning yours helps you recognize it early: "Ah, this is the tight chest and the urge to check my phone. This is my visibility response. It means I'm doing something new."`,
      example: { title: "Naming it changed the moment", text: `Before going live for the first time, Holly noticed her hands shaking and her mind going blank. In the past she would have cancelled. This time she said quietly, "This is my body getting ready. I'm excited and nervous." She took three slow breaths, opened with a sentence she had written down, and went live. The shaking lasted about two minutes and then eased.` },
      reflect: [
        "What do you notice in your body when you imagine posting something personal?",
        "What do you notice right after posting? And the next day?",
        "When have you felt similar sensations before something you were excited about?"
      ],

          ["While I'm recording or posting", "e.g. voice gets higher, mind goes blank"],
          ["Right after posting", "e.g. want to check every 2 minutes"],

      }

    {
      id: "4-2", title: "Feeling it without obeying it", mins: "4–6 min",
      objective: "Learn to make room for uncomfortable thoughts and feelings while acting on your values, and choose grounding practices that work for you.",
      body: `### Psychological flexibility [[R]]

**Acceptance and Commitment Therapy (ACT)**, developed by Steven Hayes and colleagues, focuses on **psychological flexibility**: the ability to be present with difficult thoughts and feelings while still doing what matters to you. A 2006 review by Hayes and colleagues found it relates to a wide range of wellbeing outcomes, and ACT has since gathered a substantial research base, with effects that are generally moderate rather than dramatic.

For visibility, this means you do not have to win the argument with fear before you act. You can carry the fear with you.

### Defusion: unhooking from thoughts [[E]]

One ACT skill is **defusion**: stepping back from a thought so it becomes something you notice rather than something you obey. Try adding a phrase in front of the thought:

- "I'm having the thought that this is embarrassing."
- "My mind is telling me the 'not enough' story again."

The thought is still there. It just has less grip.

### Willingness [[O]]

Ask yourself: **"Am I willing to feel this in order to do something I care about?"** Not "do I like it," not "can I make it go away," just "am I willing." Willingness turns the fear from a stop sign into a passenger.

### Grounding options: choose what works for you [[E]]

There is no single technique that calms everyone. Try these and keep the ones that help:

- **Slower breathing with a longer exhale.** A small 2023 study by Melis Balban and colleagues found that five minutes a day of "cyclic sighing" (a double inhale through the nose, then a long exhale) improved mood more than mindfulness meditation over a month. It was one small study, so treat it as promising rather than proven.
- **Grounding through the senses.** Name a few things you can see, hear and feel.
- **Feet and hands.** Press your feet into the floor, hold something warm or textured.
- **Self-distancing.** Research by Ethan Kross and colleagues found that talking to yourself using your own name ("Okay, Sarah, you can do this") helped people manage anxiety before giving a speech.
- **Movement.** A short walk, shaking out your hands, stretching.

If a practice makes you feel worse, stop. If you notice that distress around visibility is intense, persistent, or linked to trauma, a qualified therapist can help you find approaches that fit you.`,
      example: { title: "Before hitting post", text: `Imani's 60-second routine: she puts her feet flat, takes three slow breaths with long exhales, says "Imani, you're having the thought that this is too much. You're willing to feel that. Post it." Then she posts and closes the app for an hour. The routine does not remove the fear. It gives her something to do with it.` },

      id: "4-3", title: "Your visibility ladder", mins: "4–6 min",
      objective: "Build a personal sequence of visible actions, from manageable to challenging, that you can climb at your own pace.",
      body: `### Gradual exposure works [[R]]

Gradual exposure to feared situations is one of the most well-supported approaches in research on anxiety. More recent research, including work by Michelle Craske and colleagues on **inhibitory learning**, suggests exposure helps because you learn new information: the feared outcome did not happen, or it did and you coped. The point is not to grit your teeth until the fear disappears. The point is to learn something new each time.

In a therapy setting, exposure is guided by a professional. In this course, you are using the same principle at a gentle, everyday level for visibility. If a step brings up overwhelming distress, step back and consider support.

### How a ladder works [[O]]

A **visibility ladder** is a list of visible actions, each rated by how uncomfortable it feels from 0 to 10. You start with steps around 3 to 5: noticeable but doable. You repeat a step until it feels easier, then move up. Some days you might step down. That is part of it.

### Building your ladder

Use your Module 1 audit. Your easiest and hardest exposures and your hardest audience give you the raw material. Mix and match:

- **Format:** writing, carousel, voiceover, audio, video with face, live.
- **Exposure:** opinion, story, face, voice, offer.
- **Audience:** close friends, a small group, a new account, your personal account, people from your past.
- **Duration:** a 15-second clip versus a 5-minute talk.

### Sample steps (adapt freely)

- Share a written opinion in a small community or group: 2
- Post a quote card with your own words: 3
- Post a carousel teaching one idea: 4
- Record a voiceover over a calm video: 5
- Share a short personal story in writing: 5
- Post a 30-second talking video: 7
- Tell people from your past what you're building: 8
- Make an offer or invite people to your community: 8
- Go live for 10 minutes: 9

Your numbers will be different. That is the point.`,
      example: { title: "Simone's first rungs", text: `Simone rated video at 9 and writing at 3. Her ladder started with a written post on her new account (3), then a carousel (4), then a voiceover (5), then a 15-second face video with no talking, just text on screen (6), then a 30-second talking video (8). It took her seven weeks to reach the 8. By then the 5 felt like a 2.` },

      id: "4-4", title: "Behavioural experiments", mins: "4–6 min",
      objective: "Use small, planned experiments to test what you predict will happen when you are visible.",
      body: `### Test the prediction, not your worth [[R]]

**Behavioural experiments** are a well-established tool in cognitive behavioural therapy. You make a specific prediction, take an action designed to test it, and compare what happened with what you expected. The Oxford Guide to Behavioural Experiments in Cognitive Therapy (Bennett-Levy and colleagues, 2004) describes them as one of the most powerful ways to update beliefs, because the evidence comes from your own experience.

The mindset shift is important. A post is not a referendum on whether you are good enough. It is an experiment that gives you data.

### The experiment format [[O]]

1. **Prediction:** What do I expect will happen? How strongly do I believe it, from 0 to 100%?
2. **Experiment:** What will I do, when, and where?
3. **Safety behaviour to drop:** What would I normally do to feel safer, which I'll skip this time?
4. **What happened:** The facts, not the story.
5. **What I learned:** How does this compare with my prediction?
6. **Belief now:** How strongly do I believe the original prediction now?

### Experiment bank

- Post without a disclaimer or apology at the start.
- Reply to every comment on a post within a day, warmly and briefly.
- Share one opinion you usually soften.
- Post at a time when people are actually online.
- Leave a video up with one small mistake in it.
- Tell one person from your past what you're building.
- Share a story with one detail you'd normally leave out (within your boundaries).
- Ask your audience a question and wait 48 hours before judging the response.
- Post the third take instead of the tenth.
- Don't check a post for 24 hours after sharing it.
- Mention your offer or community once, clearly.
- Comment thoughtfully on five posts by others in your field.

### Expect mixed results

Sometimes a prediction partly comes true. Someone does say something unkind. That is still valuable data: you learn what it was actually like and how you coped. Experiments are about learning, not about proving the fear wrong every time.`,
      example: { title: "No disclaimer", text: `**Prediction:** If I don't start with "I'm not an expert, but…" people will call me arrogant. Belief: 70%.
**Experiment:** Post my carousel on boundaries without the disclaimer, Thursday at 6pm.
**What happened:** 14 likes, 2 saves, one comment saying "I needed this." Nobody said I was arrogant.
**Learned:** The disclaimer was for me, not them.
**Belief now:** 25%.` },

      id: "5-1", title: "Becoming someone who practises", mins: "3–5 min",
      objective: "Understand how self-belief grows from experience, and start collecting evidence of your capability.",
      body: `### Confidence comes after, not before [[R]]

Psychologist Albert Bandura's work on **self-efficacy**, your belief that you can do a specific thing, identified **mastery experiences** as its strongest source. In plain terms: you come to believe you can do something mainly by doing it, or by doing smaller versions of it.

This flips a common assumption. Many women wait to feel confident before posting. Research suggests confidence mostly grows from the posting itself.

### Visibility as a practice [[O]]

Think about any practice you have built: yoga, meditation, tarot, an instrument, a language. Nobody expects to be fluent in the first week. You show up, you do the practice imperfectly, and over time you get better and it gets easier.

Visibility can work the same way. You are not trying to *be* a visible person. You are someone who *practises* visibility. A practitioner can have an off day and still be a practitioner.

### Collecting evidence

Your brain is good at remembering failures and forgetting wins, especially if you carry the "not enough" story. An **evidence log** counteracts that. Each time you take a visible action, write it down, along with what it shows about you.

The entries can be small: "Posted a carousel even though my hands were shaking." "Replied to a comment from a stranger." "Told my aunt what I'm building." Over weeks, the log becomes proof your inner critic cannot easily argue with.

### When personal growth becomes avoidance

Notice if you start using this module as a reason to do more inner work before acting: "I need to fully embody my new identity first." Embodiment happens through action. The action is the practice.`,
      example: { title: "Reading the log", text: `After six weeks, Bea read back through her evidence log on a day when she felt like quitting. Twenty-two entries. A carousel that got saved forty times. A woman who joined her email list and wrote, "You put words to what I've been feeling." She said, "My fear tells me I've done nothing. My log tells me I've been doing this for six weeks." She posted that day.` },

    {
      id: "5-2", title: "Small promises you keep", mins: "4–6 min",
      objective: "Make visibility commitments you can actually keep, using if-then planning and lower friction.",
      body: `### Self-trust is built on kept promises

Every time you promise yourself something and do not follow through, you learn a little not to trust yourself. Every kept promise teaches the opposite. That is why the size of the promise matters so much. A small promise kept is worth more than a big one broken.

### Implementation intentions [[R]]

Psychologist Peter Gollwitzer studied **implementation intentions**: plans in the form "If situation X happens, then I will do Y." A 2006 meta-analysis by Gollwitzer and Paschal Sheeran, combining 94 studies, found these plans had a medium-to-large effect on reaching goals compared with simply intending to act.

The power comes from deciding ahead of time. When the moment arrives, you don't have to negotiate with yourself.

Examples:

- "If it's Tuesday at 7pm, then I'll open my content planner and draft one post."
- "If I notice I'm on my fourth re-record, then I'll post the best of the three."
- "If a post gets a low response, then I'll write one line in my evidence log and draft the next one."

### Habits take longer than 21 days [[R]]

A widely cited 2009 study by Phillippa Lally and colleagues followed people forming a new daily habit. On average it took 66 days to reach a plateau of automaticity, with a wide range from 18 to 254 days. Missing one day did not significantly affect the process. So be patient, and do not treat a missed day as a reason to quit.

### Reduce friction [[I]]

Make the visible action as easy as possible to start. Keep a running list of ideas. Use one template. Set up your phone and light in the same spot. Decide your posting days in advance. Every decision you remove makes follow-through more likely.

### The minimum version [[O]]

For every commitment, decide on a **minimum version** for hard weeks. If your plan is two posts a week, your minimum might be one story or one comment in your community. On a hard week, the minimum still counts. It keeps the promise alive.`,

      id: "5-3", title: "Self-compassion that keeps you going", mins: "4–6 min",
      objective: "Learn why self-compassion supports growth, and create a recovery process for difficult visibility experiences.",
      body: `### What self-compassion is [[R]]

Psychologist Kristin Neff describes **self-compassion** as three parts working together:

- **Self-kindness:** treating yourself with warmth instead of harsh judgment when things go wrong.
- **Common humanity:** remembering that struggle and imperfection are part of being human, not proof you are uniquely flawed.
- **Mindfulness:** noticing painful feelings clearly, without ignoring them or getting swept away.

### It does not make you lazy [[R]]

Many women worry that being kind to themselves will remove their motivation. Research suggests the opposite. In a 2012 series of studies, Juliana Breines and Serena Chen found that people who responded to a failure with self-compassion were *more* motivated to improve and spent more time studying for a retest than people who focused on boosting self-esteem.

Harsh self-criticism tends to increase the fear of failure, and fear of failure feeds avoidance. Self-compassion makes it safer to try again.

### Hard visibility moments will happen

A post flops. Someone you know says something dismissive. A stranger leaves an unkind comment. You stumble during a live. These are not signs you failed the course. They are part of being visible, and everyone who is visible experiences them.

### The recovery process [[O]]

When something hard happens, try these five steps:

1. **Pause.** Do not respond, delete, or make decisions for at least an hour if you can.
2. **Name it.** "This is the exposure hangover." "This is the 'not enough' story." "This hurt."
3. **Normalize it.** "Every person who shares their work has felt this."
4. **Meet the need.** Ask, "What do I need right now?" Rest, a walk, a friend, a reminder from your evidence log.
5. **Choose the next step.** One small action, often just "draft the next post," or "leave it for 24 hours."

### Self-compassion is not ignoring feedback

Sometimes a hard moment carries useful information. Self-compassion lets you look at that information without collapsing into shame. You can say, "That stung, and there's something here to learn," at the same time.`,

      body: `### Why routines help [[E]]

Routines reduce the number of decisions you have to make in a vulnerable moment. When the steps are already decided, there is less room for the fear to bargain. Routines also create a sense of predictability, which tends to make uncertain situations easier to tolerate.

### Before: the pre-publishing routine [[O]]

1. **Check it once** against your "done" questions: clear, true, useful.
2. **Do your 60-second practice** from Module 4.
3. **Set an intention**: who is this for, and what do I hope they feel or understand?
4. **Decide when you'll check it**, for example once after two hours and once the next morning.
5. **Post it.**

### During: the first hour [[O]]

The first hour after posting is when the urge to check, edit or delete is strongest. Decide ahead of time what you'll do instead. Many women find it helps to leave the app entirely, do something physical, or go straight into an unrelated task.

If you choose to reply to early comments, reply warmly and briefly, then close the app again.

### After: the post-publishing reflection [[O]]

The next day, take five minutes to answer:

- What did I do? (Add it to your evidence log.)
- What did I fear would happen?
- What actually happened?
- What did I learn about my audience, my content or myself?
- What's my next visible action?

A message statement is a single sentence that captures who you help, the change you help with, how, and why. It is not a tagline. It is a working tool that keeps your content focused.

      body: `### Story builds connection [[I]]

Stories help people relate to you and remember your ideas. But connection does not require you to share everything. Your audience does not need the full details of your divorce, your diagnosis, or your family conflict to trust you. They need enough to recognize themselves, and a lesson they can use.

### Healed enough to share [[I]]

A common piece of advice in the creator and speaking world is to share from wounds that have healed into scars, rather than wounds that are still open. It is not research, but it is a useful test. Ask:

- Have I processed this enough that I can talk about it without needing the audience's reaction to feel okay?
- If someone responded unkindly, could I handle it?

### Other people's stories

Your story includes other people: partners, children, parents, ex-partners, clients. Consider their privacy. Ask permission where you can, change details where you need to, and focus on your own experience rather than describing theirs.

### Three levels of sharing [[O]]

- **Public:** the lesson and enough of the story to make it real. "When my marriage ended, I realized I'd been shrinking for years."

You are free to share your beliefs, your experiences and what has helped you. Problems arise when beliefs are presented as guaranteed outcomes or established facts. Compare:

- "Tarot helps me reflect on my choices" versus "Tarot will tell you your future."

The first in each pair is honest. The second may mislead someone, and in some cases can create legal risk.

### Know the basics [[I]]

Consumer protection laws in Canada, the United States and many other countries prohibit false or misleading claims in marketing, including claims about results and income. Health claims carry additional rules. You do not need to be a lawyer to stay safe, but you should avoid promising outcomes you cannot guarantee and avoid suggesting your work replaces medical or mental health care. If you are unsure about a specific claim, seek proper advice.

### Honest language that is still warm [[O]]

You do not have to sound like a legal document. Some useful phrases:

- "Here's what helped me…"
- "Many people find…"
- "In my experience…"
- "This is a tool for reflection, not a prediction."
- "This isn't a replacement for therapy or medical care."

### Respecting traditions [[I]]

Many spiritual practices come from specific cultures and lineages. Where you teach or borrow from a tradition, learn where it comes from, credit it, and be careful about selling sacred practices from cultures that are not yours without real relationship and permission. If you are unsure, ask people from that tradition and listen.

      body: `### What pillars are [[I]]

**Content pillars** are three to five recurring themes you create around. They keep your content focused, help people understand what you're about, and make it much easier to decide what to post. Most experienced creators use some version of them.

Good pillars sit where three things overlap: what your audience needs, what you know or have lived, and what you genuinely care about.

### A common pillar mix [[O]]

For a visibility or spiritual business, a balanced set often includes:

- **A teaching pillar:** the core skills or ideas you help with (for example, practical tools for overcoming fear of being seen).
- **A perspective pillar:** your beliefs and reframes (for example, why spiritual women don't need to hustle to build a business).
- **A story pillar:** your journey and lived experience (within your disclosure map).
- **A practice pillar:** the spiritual or reflective tools you use (Human Design, tarot, intuition, meditation).
- **A community or offer pillar:** what happens inside your community, client stories with permission, invitations.

You don't need all five. Three strong pillars beat five vague ones.

### Where ideas come from

Most good content answers something your audience is already thinking. Look for:

- **Pain points:** what's hard for her right now. "I keep starting and stopping."
- **Desires:** what she wants. "I want to be paid for my readings."

- **Objections:** why she hesitates. "I'm too old to start a business online."

- **Your stories:** moments from your own journey that hold a lesson.

### Keep an idea bank

      objective: "Write opening lines that make the right person stop, without misleading anyone.",
      body: `### Why the opening matters [[I]]

On short-form platforms, people decide very quickly whether to keep watching or reading. The first line or first few seconds, often called the **hook**, carries a lot of weight. That's not a research law. It's consistent experience across creators and platforms.

### What research says about attention and sharing [[R]]

Two findings are useful here.

**The information gap.** George Loewenstein's 1994 theory of curiosity suggests that curiosity is triggered when we notice a gap between what we know and what we want to know. A good hook opens a small, honest gap.

**Emotion and sharing.** In a 2012 study of New York Times articles, Jonah Berger and Katherine Milkman found that content evoking high-arousal emotions, such as awe, and also anxiety or anger, was more likely to be shared, and that practically useful content was also shared more. Calm sadness, by contrast, was linked to less sharing. This was one study of one kind of content, but it supports a simple idea: content that makes people *feel* something or *gain* something travels further.

### Hook types [[I]]

- **Call-out:** names the person. "If you've been writing captions you never post, this is for you."
- **Reframe:** challenges a belief. "You're not afraid of being seen. You're afraid of being seen by people who knew the old you."
- **Question:** asks what she's already wondering. "Why does posting feel so much harder than it should?"
- **Story open:** drops into a moment. "I deleted my first video eleven minutes after posting it."
- **Specific promise:** clear and deliverable. "Three ways to post this week without showing your face."
- **Mistake:** names something she may be doing. "The disclaimer that's quietly making you sound less trustworthy."
- **Nobody tells you:** "Nobody tells you that the hardest audience is people you already know."

### The honesty rule [[O]]

**Your content must deliver what your hook promises.** Misleading clickbait might get a view, but it costs trust, which is the thing your business actually runs on. A strong honest hook is specific, relevant to her, and true.

### Hooks are a skill

Your first hooks will feel stiff. That's fine. Write several for each idea and choose the one that sounds most like you talking to a friend. The Toolkit has a bank of 15 hooks to adapt.`,
