    {
      id: "7-3", title: "The Six Beats: short-form video", mins: "4–6 min",
      objective: "Plan a short-form video using a simple six-part structure, in a format that fits your ladder.",
      body: `### A structure, not a formula [[O]]

**The Six Beats** is a structure created for this course. It draws on common short-form practice and basic storytelling. It is a starting point, not a rule. Some videos will use all six beats; some will compress or skip one. Test and adapt.

A note on sources: you may have heard of named short-form frameworks from well-known creators. Where we could not verify a framework's exact original components from the creator's own published material, we chose not to reproduce it, so we don't put words in anyone's mouth.

### The Six Beats

1. **Hook** (about 0 to 3 seconds). Stops the right person. Use one of the hook types from the last lesson.
2. **Tension** (3 to 10 seconds). Names the problem or feeling she has. "You've written the caption. You've filmed the video. And then you just… don't post it."
3. **Context** (10 to 20 seconds). Briefly explains why this happens or why it matters. This is where a research finding, a story moment, or your perspective goes.
4. **Shift** (20 to 35 seconds). The insight, reframe or solution. The moment she sees it differently.
5. **Takeaway** (35 to 50 seconds). One concrete thing she can do or remember. Specific beats general.
6. **Invitation** (last 5 to 10 seconds). A clear next step: save this, comment a word, follow for more, join the community. One invitation, not three.

Timings are rough guides for a 45 to 60 second video. Shorter videos compress the middle.

### Why it works [[I]]

The structure gets to the point quickly, gives her a reason to keep watching (the tension), delivers value (shift and takeaway), and makes it easy to take the next step. These are broadly what creators find helps people watch to the end and engage.

### Delivery options for any ladder step

- **Talking to camera:** strongest personal connection, highest exposure.
- **Voiceover with calm footage:** your voice, your hands, nature, your desk, a candle. Lower exposure, still personal.
- **Text on screen:** footage with on-screen text and music. No face, no voice.
- **Faceless walk-and-talk:** filming the view while you talk.

Choose the format that sits on your current rung. The beats work in all of them.

### Recording tips [[I]]

- Write the script, then talk it rather than reading it word for word.
- Keep your phone at eye level and face a window for soft light.
- Cut pauses in editing; a quicker pace often helps people keep watching.
- Add captions. Many people watch without sound, and captions help accessibility.`,

      body: `### Why carousels are useful [[I]]

Carousels (multi-slide posts) let you teach something step by step without being on camera. Many creators find they get saved and shared often, because people want to come back to useful content. They are a strong lower-exposure option for the Opinion and Teaching parts of your ladder.

### A seven-slide structure [[O]]

1. **Hook slide:** a clear headline that makes her want to swipe. Large text, few words.
2. **Recognition:** describe her situation so she thinks, "That's me."

      objective: "Design a weekly visibility rhythm based on your real capacity, not someone else's schedule.",
      body: `### There is no perfect posting frequency [[I]]

You'll hear confident advice: post daily, post three times a day, post twice a week. The honest answer is that what works varies by platform, audience, format, and the creator's capacity. Platforms change their systems often. Beware anyone who says one frequency works for everyone.

What does seem to matter, across most creator experience, is **consistency over time**. Posting twice a week for a year usually beats posting daily for three weeks and then disappearing.

### Consistency means returning [[O]]

In this course, consistency doesn't mean never missing. It means coming back. A rhythm you can keep on a hard week is worth more than an ambitious one you abandon.

### A weekly workflow [[I]]

Many creators break visibility into separate stages so they don't have to do everything at once:

- **Gather:** add ideas to your idea bank (10 minutes, any time).
- **Create:** batch-create two or more pieces in one sitting.
- **Publish:** post using your pre-publishing routine.
- **Engage:** reply to comments, comment on others' posts, show up in your community.
- **Review:** a short weekly check-in, and a deeper monthly review (next lesson).

Batching, creating several pieces in one session, saves the energy of switching into "creator mode" every day.

### Work with your energy

Some women have steady energy across the week. Others have bursts. Some have monthly or seasonal rhythms, caregiving demands, health conditions, or shift work. Design for the real you. If you create best in bursts, batch a month's content in one weekend. If evenings are your only time, keep your rhythm small and protected.

### A spiritual lens on energy [[S]]

      body: `### Three kinds of results [[O]]

It helps to separate what you're measuring:

- **Reach:** how many people saw it. Views, impressions, accounts reached. This is mostly about distribution, timing and platform systems.
- **Resonance:** how much it mattered to the people who saw it. Saves, shares, thoughtful comments, replies, messages, watch time or completion where your platform shows it.
- **Results:** what it led to. Follows from the right people, email sign-ups, community joins, conversations, enquiries, sales.

Early on, reach is usually low and unpredictable. Resonance is often the most useful signal for improving your content. Results are what matter for your business, and they often lag behind.

### Vanity metrics [[I]]

Likes and follower counts feel important and are the easiest to see. They can be useful, but they don't always connect to business progress. A post with 30 likes that brings two people into your community did more for your business than a post with 3,000 views and no conversations.

### Small numbers, big swings

When your audience is small, results vary a lot from post to post for reasons you can't see. Don't draw big conclusions from one post. Look at patterns across several weeks.

### Test one thing at a time [[I]]

If you want to learn what works, change one variable at a time where you can: the hook, the format, the time of day, the topic. Keep everything else similar. Use the experiment log in the Toolkit to record what you tried. Even then, results are noisy, so treat what you find as a hint, not a law.

### The monthly review [[O]]

Once a month, spend 30 minutes with your tracker and ask:

- Which pieces had the strongest resonance? What do they have in common?

### Your worth is not in the numbers

You'll still feel the pull to read low numbers as a judgment on you. When you notice it, use your recovery plan from Module 5. The numbers describe a piece of content on a particular day. They don't describe you.`,
      example: { title: "What the numbers said", text: `After two months, Grace noticed her talking videos got more views, but her carousels got three times the saves and almost all her email sign-ups came from carousels. She kept one video a week for reach and made carousels her main teaching format. Her community grew faster, even though her view count went down.` },

      id: "8-3", title: "Criticism, silence and low engagement", mins: "4–6 min",
      objective: "Prepare a calm, boundaried response to the hard parts of being visible.",
      body: `### Four kinds of hard feedback [[O]]

Not all feedback is the same. Sorting it helps you respond well.

- **Useful critique:** points to something you could genuinely improve, often from someone in your audience. "I didn't understand the second step."
- **Disagreement:** someone sees it differently. This is part of having a point of view, not a sign you were wrong.
- **Cruelty or trolling:** attacks, mockery, or bad-faith comments. These say more about the writer than about you.
- **Silence:** little or no response. Usually about reach, not rejection (see Module 3).

### Whose opinion counts?

A useful question: **"Is this someone I would go to for advice?"** Feedback from your ideal audience, a mentor, or a respected peer deserves consideration. Feedback from a stranger who would never be your client, or from someone who knew the old you and is reacting to your change, deserves much less weight.

### Your response options

- **Thank and learn** (useful critique): "Thank you, that's helpful. I'll make that clearer."
- **Acknowledge and hold your view** (disagreement): "I appreciate you sharing a different perspective. Here's why I see it this way…" or simply, "Thanks for sharing your view."
- **Don't engage** (cruelty): you do not owe a response. Deleting, hiding or blocking is allowed. Your page is your space.
- **Keep going** (silence): note it in your tracker, use your recovery plan if needed, and post the next piece.

### Boundaries for your spaces [[O]]

Decide in advance what is and isn't welcome in your comments and community: for example, disagreement yes, insults no. Writing this down before it's needed means you won't have to decide in a moment of hurt.

### When it's someone you know

Comments from family, friends or old colleagues can sting more than anything a stranger says. People often react to change in someone they know, because it changes their picture of you. Their reaction is information about their discomfort, not proof that you should go back to being who you were.

### When to get support

If criticism turns into harassment, threats, or ongoing targeting, use platform reporting tools, keep records, and reach out to people you trust. If it affects your safety, contact the appropriate authorities.`,

      objective: "Map a simple pathway from content to your offer, and identify your next business-building action.",
      body: `### Audience growth is not the same as business progress

It's possible to grow a following and still have no clients, members or income. It's also possible to build a profitable small business with a small, engaged audience. What connects the two is a **pathway**: a clear route from "she saw my post" to "she joined" or "she bought."

### The visibility-to-conversion pathway [[O]]

1. **Discover:** she finds your content (short videos, carousels, posts, podcasts, collaborations).
2. **Connect:** she engages: comments, replies to a story, messages you, keeps watching.
3. **Capture:** she joins something you can reach directly: an email list, a free community, a free resource or challenge.
4. **Convert:** she accepts an offer: a paid community, course, reading, session or program.
5. **Continue:** she stays, deepens, and often tells others.

You don't need a complex funnel. You need each step to exist and to lead to the next one.

### Trust comes before the ask [[I]]

Most people need to encounter you several times before they feel ready to buy, especially for personal or spiritual services. That's why content that helps, consistently, matters more than a single perfect sales post. Each useful piece adds a little trust.

### Conversations are the hidden step [[I]]

For small businesses, especially service businesses, real conversations often convert better than content alone. Replying thoughtfully to comments and messages, asking questions in stories, and following up with people who engage are some of the most effective and most overlooked visibility actions. They are also often less scary than posting, because they're one-to-one.

### At the idea stage

If you don't have an offer yet, your pathway might stop at Capture for now: build an email list or free community while you test what people want. Ask them. Their answers can shape your first offer.

      body: `### Asking is a visibility step

Remember the five exposures: **Offer** is often the hardest. Asking people to join or buy can stir up old stories about money, worthiness, greed, or "spiritual people shouldn't charge." If this feels heavy, add invitation steps to your ladder and treat early invitations as behavioural experiments.

### Many people under-invite [[I]]

A common pattern among new creators is creating lots of helpful content and almost never mentioning the offer. Then they conclude that "nobody wants it." Often, most of their audience simply doesn't know it exists. People need to hear about an offer more than once, in different ways, before they act.

### Ethical persuasion [[O]]

An ethical invitation helps the right person make a good decision. It does not pressure, shame or trick. Avoid:

- **Fake scarcity:** "Only 2 spots left!" when that isn't true.
- **False urgency:** countdowns that reset, or deadlines that don't really exist.
- **Fear-based selling:** "If you don't join, you'll stay stuck forever."
- **Income or outcome promises** you can't guarantee.

Real deadlines and real limits are fine. Honesty is the line.

### An invitation structure [[O]]

1. **Who it's for:** "If you're a spiritual woman who wants to be seen but keeps hiding…"
2. **What it is:** plainly. "It's a community where we practise visibility together, with monthly live calls and weekly prompts."
3. **What changes:** realistic outcomes. "Members tell me the biggest change is having people to post alongside."
4. **How to join:** exact steps and price, if any.
5. **Permission to say no:** "If it's not the right time, that's completely okay. I'll keep sharing here."

### Introducing your Skool community (or any community)

When inviting people to a community, help them picture being inside: what happens weekly, who's there, how they'll be welcomed, and what they can do in their first week. If you have a free and a paid level, explain the difference simply.

### How often to mention your offer [[I]]

There's no universal rule. A common approach is to include a light invitation in some of your regular content (a line at the end, a link in your bio, a mention in stories) and a fuller invitation post every couple of weeks. Watch your results and adjust.`,

      objective: "Build a realistic 30-day plan that combines content, ladder steps, business actions and review.",
      body: `### What goes into the plan [[O]]

Your 30-day plan pulls together everything you've built:

- **Content:** from your pillars, idea bank and six-piece method, at the rhythm you designed in Module 8.
- **Ladder steps:** two to four rungs you'll climb this month.
- **Business actions:** the next step from your pathway, and at least two invitations.

- **Review:** one weekly check-in and one end-of-month review.
- **Rest:** planned days off. Rest is part of the plan, not a break from it.

### Weekly themes help

Giving each week a focus makes planning easier. For example:

- **Week 1:** Foundation. Update your bio with your message statement. Post two pieces. Climb one rung.
- **Week 2:** Connection. Post two pieces. Reply to every comment. Have three conversations.

      { title: "Five complete scripts", md: `Each script runs about 45 to 60 seconds when spoken naturally. Change the words until they sound like you. Speak them rather than reading them.

#### Script 1: Twenty people
**Hook:** You're not scared of the internet. You're scared of about twenty people.
**Tension:** Strangers? Fine. It's your old coworkers. Your cousin. That one friend from high school who always had something to say.
**Context:** That makes sense. Being seen by people who knew the old you feels like it could cost you your place. Humans are wired to care about belonging. Your brain is doing its job.
**Shift:** But you don't have to start in front of them. You're allowed to build somewhere they aren't looking yet.
**Takeaway:** So for your first twenty posts, try a fresh account, or share your stories with your close-friends list only. Let yourself practise before the hard audience shows up.
**Invitation:** If you want my visibility ladder to plan those first steps, comment TWENTY.

#### Script 2: The draft graveyard
**Hook:** How many drafts are sitting in your notes app right now?
**Tension:** Captions you rewrote five times. Videos you filmed and never posted. Ideas you were sure about until you weren't.
**Context:** Polishing feels productive. But often it's a way to avoid the moment you hit post, because that's the moment you can be judged.
**Shift:** The question isn't "is it perfect?" It's three smaller questions.
**Takeaway:** Is it clear? Is it true? Is it useful to someone? If the answer is yes three times, it's ready. Pick one draft and post it today.
**Invitation:** Then come back and comment "posted" so I can cheer for you.

#### Script 3: Confidence comes after
**Hook:** If you're waiting to feel confident before you post, I've got bad news and good news.
**Tension:** The bad news: that feeling might not show up first. You could wait for years.
**Context:** Research on self-belief suggests we mostly come to believe we can do something by doing it, or doing smaller versions of it.
**Shift:** The good news: that means you don't need confidence to start. You need a small enough first step.
**Takeaway:** Pick one tiny visible action this week. A story. A comment. A written post. Do it, then write down what you did. That note is the beginning of your confidence.
**Invitation:** Save this for the next time you're waiting to feel ready.

#### Script 4: You don't have to share your trauma
**Hook:** You don't have to share your trauma to build trust.
**Tension:** There's this idea that being authentic means telling everyone everything. Your hardest moments, in detail, on the internet.
**Context:** But authenticity means what you share is real. Not that you share all of it.
**Shift:** People don't need the full story to trust you. They need enough to recognize themselves, and a lesson they can use.
**Takeaway:** Try sorting your stories into three levels: public, private, and sacred. Share the lesson publicly. Keep the details for trusted spaces, or for yourself.
**Invitation:** Follow along if you want to be visible without giving all of yourself away.

#### Script 5: Spiritual and paid
**Hook:** Spiritual women: you're allowed to want to be paid for your gifts.
**Tension:** And yet, the moment you think about charging, something tightens. Maybe it feels greedy. Maybe it feels like it cheapens the work.
**Context:** For a lot of us, that comes from an old rule. Good women give. They don't ask.
**Shift:** But being paid is an exchange, not a betrayal. It lets you keep doing the work, and do it well.
**Takeaway:** This week, notice your money story. Write it down in one sentence. Then ask: is this rule mine, or one I was handed?
**Invitation:** Tell me in the comments what your money story says. I'll go first in the replies.` },
      { title: "Carousel structure and five outlines", md: `**The seven-slide structure** [[O]]: Hook, Recognition, Explanation, Reframe, Steps, Closing insight, Invitation. Steps can take two slides if needed.

/* QVC store: saves to the viewer's private account space when the artifact

  var mode = "local", db = null, uid = null, statusFn = opts.onStatus || function () {};

        var c = cs[i];
        await db.doc("data/users/" + uid + "/" + c).set({ d: chunkData(c), t: stamps[c] || Date.now() });
      }
      status("account");
    } catch (e) {
      cs.forEach(function (c) { dirty[c] = 1; });
      if (e && e.code === "invalid_argument") { mode = "local"; status("local"); }
      else status("error");

  function set(k, v) {

      var changed = false;
      snaps.forEach(function (s, i) {
        var c = chunks[i];
        var body = s && s.exists ? s.data() : null;
        if (body && (body.t || 0) > (stamps[c] || 0)) {
          for (var k in state) if (chunkOf(k) === c) delete state[k];
          var dd = body.d || {}; for (var k2 in dd) state[k2] = dd[k2];

    var old = Object.keys(state).map(chunkOf);
    state = obj || {};

  }

    get: function (k, d) { return k in state ? state[k] : d; },
    set: set,
    all: function () { return JSON.parse(JSON.stringify(state)); },

function vStart() {
  var h = '<div class="wrap"><span class="eyebrow">Getting started</span><h1 class="ptitle gt">How this course works</h1><div class="prose">';
  h += md(`This course has an orientation and nine modules in three phases: **the Ring** (understanding how you hide), **the Gap** (building capacity to step out) and **the Star** (being seen with intention, and connecting it to your business).

### What each lesson includes

Every lesson has a short video, written teaching, a real-life example, reflection questions and a practical exercise. Each module ends with an implementation task, a completion checklist, a short knowledge check and a bridge to what comes next. The **Toolkit** holds the content creation system and your planners. **My Plan** gathers your key answers in one place.

### How long it takes

About 3 hours of short video lessons across 38 lessons (most are 4 to 8 minutes), plus roughly 12 to 16 hours of exercises and real-world practice. The videos are short on purpose: most of the change happens in the exercises. At the recommended pace of one module a week, that's about ten weeks.

### Pacing options

- **Steady (recommended):** one module per week, about 10 weeks.
- **Gentle:** one module every two weeks, about 20 weeks.
- **Focused:** two modules per week, about 5 weeks.

Do each module's implementation task before moving on. You can go back to any lesson at any time.

### Marking progress

Lessons are only marked complete when you press **Mark lesson complete**. Nothing is ticked automatically. If you skip an exercise, come back later; My Plan lists what's still open.

### If you get stuck

Go smaller. Pick the tiniest version of the exercise, or the lowest rung on your ladder. Reread the example. Use your safety anchors. Skip optional parts. Getting stuck usually means a step is too big, not that you're doing it wrong.`);

Everything you type saves automatically as you go. When you're signed in where this course is hosted, your answers are saved privately to your account, visible only to you, so they follow you between devices. Otherwise they're saved in this browser on this device. The indicator at the top of the page shows which.

Browser storage can be cleared, so use **My Plan → Backup** from time to time to copy a backup of your work.

### Looking after yourself

This course is educational. It is not therapy, and it is not a substitute for individual mental health care. Some lessons touch on shame, identity and old experiences. If something brings up distress that feels persistent or overwhelming, pause and reach out to a qualified professional. If you are ever in crisis, contact local emergency services or a crisis line. In Canada and the United States you can call or text 988.`) + '</div><div style="margin-top:28px;display:flex;gap:10px;flex-wrap:wrap"><a class="btn primary" href="#m0">Open the Orientation</a><a class="btn ghost" href="#home">Course home</a></div></div>';
